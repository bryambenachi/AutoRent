
services:
  postgres:
    image: postgres:16
    container_name: autorent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autorent
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - autorent_data:/var/lib/postgresql/data
      - ./database/autorent.sql:/docker-entrypoint-initdb.d/01-autorent.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d autorent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autorent_data:
